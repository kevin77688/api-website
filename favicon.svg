<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded dark background badge -->
  <rect width="64" height="64" rx="16" fill="#0c0e14" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#222a3d" stroke-width="1.5" />
  
  <!-- Outer glowing neural hexagon / layer stack -->
  <g filter="url(#glow)">
    <path d="M32 10 L50 20 L50 44 L32 54 L14 44 L14 20 Z" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Inner dimensional prism -->
    <path d="M32 10 L32 32 L50 44" fill="none" stroke="rgba(244, 63, 94, 0.4)" stroke-width="2"/>
    <path d="M32 32 L14 44" fill="none" stroke="rgba(244, 63, 94, 0.4)" stroke-width="2"/>
    <path d="M32 32 L50 20" fill="none" stroke="rgba(244, 63, 94, 0.4)" stroke-width="2"/>
    <path d="M32 32 L14 20" fill="none" stroke="rgba(244, 63, 94, 0.4)" stroke-width="2"/>

    <!-- Central AI Neural Core -->
    <circle cx="32" cy="32" r="5" fill="url(#core)" />
    <circle cx="32" cy="10" r="2.5" fill="#f43f5e" />
    <circle cx="50" cy="20" r="2.5" fill="#f43f5e" />
    <circle cx="50" cy="44" r="2.5" fill="#f43f5e" />
    <circle cx="32" cy="54" r="2.5" fill="#f43f5e" />
    <circle cx="14" cy="44" r="2.5" fill="#f43f5e" />
    <circle cx="14" cy="20" r="2.5" fill="#f43f5e" />
  </g>
</svg>
